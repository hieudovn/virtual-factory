# FactoriX Sim public entry on the existing PlantOS UAT nginx.
# MQTT / TDengine stay unpublished. Only these VF HTTP prefixes are proxied.
#
# Install: include from /etc/nginx/sites-enabled/plantos-uat inside the
# existing server { listen 80; } block, then nginx -s reload.

location /factorix-sim/ {
    proxy_pass http://127.0.0.1:8090/factorix-sim/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /factorix-sim {
    proxy_pass http://127.0.0.1:8090/factorix-sim;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
}

