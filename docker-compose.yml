services:
  mqtt:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./deploy/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  virtual-factory-api:
    build: .
    depends_on:
      - mqtt
    command:
      - virtual-factory
      - serve
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --dt
      - "1"
      - --scenario
      - configs/scenarios/valve_stuck.yaml
      - --auto-start
      - --mqtt-host
      - mqtt
      - --mqtt-port
      - "1883"
      - --mqtt-connect-retries
      - "30"
      - --mqtt-connect-delay
      - "1"
      - --mqtt-topic-prefix
      - virtual-factory/demo/continuous_mvp_01
    ports:
      - "8000:8000"
    volumes:
      - ./out:/app/out
