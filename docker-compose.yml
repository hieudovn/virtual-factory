services:
  mqtt:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./deploy/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  virtual-factory-api:
    build: .
    depends_on:
      - mqtt
    command:
      - virtual-factory
      - serve
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --dt
      - "1"
      - --scenario
      - configs/scenarios/valve_stuck.yaml
      - --auto-start
      - --mqtt-host
      - mqtt
      - --mqtt-port
      - "1883"
      - --mqtt-connect-retries
      - "30"
      - --mqtt-connect-delay
      - "1"
      - --mqtt-topic-prefix
      - virtual-factory/demo/continuous_mvp_01
      - --opcua-endpoint
      - opc.tcp://0.0.0.0:4840
    ports:
      - "8000:8000"
      - "4840:4840"
    volumes:
      - ./out:/app/out

  # ------------------------------------------------------------------
  # VF-2: PIM-native Simulation Runtime (Local Dev)
  # ------------------------------------------------------------------
  vf2-simulator:
    build:
      context: .
      dockerfile: deploy/vf2.Dockerfile
    command:
      - python
      - -m
      - simulators.vf2.main
      - --package
      - simulators/vf2/examples/sample_pim_package.json
      - --config
      - simulators/vf2/config.yaml
      - --api-server
    ports:
      - "8102:8102"
    volumes:
      - ./simulators/vf2:/app/simulators/vf2
      - ./out:/app/out
