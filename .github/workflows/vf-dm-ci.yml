name: VF-DM CI

on:
  push:
    branches: [main, feature/dm-*]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q --tb=short
      - name: Smoke — virtual-factory validate
        run: virtual-factory validate --config configs/plants/compressor_train_benchmark_01.yaml
      - name: Smoke — VF2 validate
        run: python -m simulators.vf2.main --package simulators/vf2/examples/sample_pim_package.json --validate-only
