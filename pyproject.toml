[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "virtual-factory"
version = "0.1.0"
description = "Physics-informed virtual plant and control lab for industrial telemetry generation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "httpx>=0.27",
  "jsonschema>=4.0",
]
mqtt = [
  "paho-mqtt>=2.0",
]
api = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
]
opcua = [
  "asyncua>=1.0",
]
sparkplug = [
  "paho-mqtt>=2.0",
  "protobuf>=4.0",
]

[project.scripts]
virtual-factory = "virtual_factory.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"virtual_factory.ui" = ["static/*.html", "static/*.js", "static/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
