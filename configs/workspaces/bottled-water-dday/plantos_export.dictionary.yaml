unavailable:
  - source_id: BW-UT-CMP01
    signal_id: load
    area_id: BW-UT
    family: compressor
    semantic_role: condition_measurement
    export_status: UNAVAILABLE
    not_exported: true
    reason: >
      No dedicated compressor load/drive_load raw signal exists on the factory
      snapshot. Electrical load is already published as BW-UT-CMP01.active_power.
      C02 does not fabricate a load fact.

  - source_id: BW-FP
    signal_id: target_rate
    area_id: BW-FP
    family: production
    semantic_role: configured_target
    export_status: UNAVAILABLE
    not_exported: true
    reason: >
      B1 configured_targets.BW-FP.target_rate is CONFIGURED_TARGET metadata and
      is not published as a factory raw signal. C02 does not invent it.
