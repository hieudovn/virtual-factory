# DDAY-B6 selected VF→PlantOS export dictionary.
# Small allowlist only. Unmapped factory signals are not exported and must
# not be invented as PlantOS semantics. Reuses B1 contract_version.
# C02 completes required coverage and states timestamp semantics.
contract_version: dday-bw-b1-v1
workspace_id: bottled-water-dday
plant_source_id: BW-DEMO-01
default_quality: GOOD
default_provenance: SIMULATED_RAW
utc_epoch: "2026-10-03T00:00:00.000Z"
topic_pattern: "virtual-factory/bottled-water-dday/{kind}/{asset_id}/{signal_or_event}"
fail_closed: true
timestamp_semantics:
  timestamp: simulated_source_utc
  timestamp_meaning: >
    Deterministic simulated-source UTC instant for ordering and replay
    (frozen epoch 2026-10-03T00:00:00.000Z + simulation_time_s).
    Not wall-clock receipt time.
  simulation_time_s: simulation_elapsed_seconds
  receipt_time: plantos_or_runtime_owned_not_generated_by_vf

# Issue #112 required review-set: every fact has an explicit disposition.
review_set:
  - { source_id: BW-WT-FEED01, signal_id: water_flow, disposition: EXPORTED }
  - { source_id: BW-WT-RO01, signal_id: production_flow, disposition: EXPORTED }
  - { source_id: BW-WT-TK01, signal_id: level, disposition: EXPORTED }
  - { source_id: BW-FP, signal_id: operating_state, disposition: EXPORTED }
  - { source_id: BW-FP, signal_id: total_count, disposition: EXPORTED }
  - { source_id: BW-FP, signal_id: good_count, disposition: EXPORTED }
  - { source_id: BW-FP, signal_id: reject_count, disposition: EXPORTED }
  - { source_id: BW-FP, signal_id: target_rate, disposition: UNAVAILABLE }
  - { source_id: BW-FP-FIL01, signal_id: fill_rate, disposition: EXPORTED }
  - { source_id: BW-FP-CAP01, signal_id: operating_state, disposition: EXPORTED }
  - { source_id: BW-FP-CAP01, signal_id: speed, disposition: EXPORTED }
  - { source_id: BW-FP-CAP01, signal_id: cycle_time, disposition: EXPORTED }
  - { source_id: BW-FP-CAP01, signal_id: cap_torque, disposition: EXPORTED }
  - { source_id: BW-FP-CAP01, signal_id: motor_current, disposition: EXPORTED }
  - { source_id: BW-FP-CAP01, signal_id: drive_load, disposition: EXPORTED }
  - { source_id: BW-FP-CAP01, signal_id: vibration_rms, disposition: EXPORTED }
  - { source_id: BW-FP-CAP01, signal_id: bearing_temperature, disposition: EXPORTED }
  - { source_id: BW-UT-CMP01, signal_id: operating_state, disposition: EXPORTED }
  - { source_id: BW-UT-CMP01, signal_id: air_pressure, disposition: EXPORTED }
  - { source_id: BW-UT-CMP01, signal_id: active_power, disposition: EXPORTED }
  - { source_id: BW-UT-CMP01, signal_id: energy_total, disposition: EXPORTED }
  - { source_id: BW-UT-CMP01, signal_id: load, disposition: UNAVAILABLE }
  - { source_id: BW-WH-FG01, signal_id: inventory_count, disposition: EXPORTED }
  - { source_id: BW-WH-FG01, signal_id: receipt_count, disposition: EXPORTED }
  - { source_id: BW-WH-FG01, signal_id: dispatch_count, disposition: EXPORTED }
  - { source_id: BW-UT-PWR01, signal_id: plant_active_power, disposition: EXPORTED }
  - { source_id: BW-UT-PWR01, signal_id: plant_energy_total, disposition: EXPORTED }

families:
  wt: Water Treatment process measurements
  production: Filling & Packaging production counts and machine state
  capper: Capper hero condition and machine state
  compressor: Compressor utility pressure and machine state
  fg: Finished-goods inventory
  energy: Plant electrical energy

