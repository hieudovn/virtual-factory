id: flow_transmitter_v1
display_name: Flow Transmitter
category: instrumentation
version: 1
description: Sensor placeholder that converts true flow into a measured industrial signal.
parameters:
  range_min_m3_s:
    type: number
    default: 0.0
  range_max_m3_s:
    type: number
    default: 0.05
  noise_std_m3_s:
    type: number
    default: 0.0
ports:
  measurement_input:
    kind: measurement
    direction: in
  signal_output:
    kind: signal
    direction: out
supported_variables:
  - flow_true
  - flow_measured
ui:
  icon: gauge
  group: instrumentation
  layout_hint: instrument_node
