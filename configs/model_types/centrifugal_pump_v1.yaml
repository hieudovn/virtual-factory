id: centrifugal_pump_v1
display_name: Centrifugal Pump
category: equipment
version: 1
python_class: virtual_factory.equipment.pump.Pump
description: Centrifugal pump with quadratic head-vs-flow curve and shutoff head.
parameters:
  rated_flow_m3_s:
    type: number
    default: 0.01
  rated_head_m:
    type: number
    default: 20.0
  pipe_resistance:
    type: number
    default: 5.0e8
ports:
  inlet:
    kind: physical
    direction: in
    medium: liquid
  outlet:
    kind: physical
    direction: out
    medium: liquid
supported_variables:
  - flow_true
  - discharge_pressure_true
  - speed_true
ui:
  icon: pump
  group: equipment
  layout_hint: process_node
