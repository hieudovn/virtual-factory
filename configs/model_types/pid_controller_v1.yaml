id: pid_controller_v1
display_name: PID Controller
category: control
version: 1
description: PID controller placeholder that consumes measured PV signals and emits controller output.
parameters:
  kp:
    type: number
    default: 1.0
  ki:
    type: number
    default: 0.0
  kd:
    type: number
    default: 0.0
  scan_time_s:
    type: number
    default: 0.5
ports:
  pv_input:
    kind: signal
    direction: in
  sp_input:
    kind: signal
    direction: in
  output:
    kind: signal
    direction: out
supported_variables:
  - process_variable
  - setpoint
  - controller_output
ui:
  icon: controller
  group: control
  layout_hint: control_node
