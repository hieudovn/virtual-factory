id: control_valve_v1
display_name: Control Valve
category: equipment
version: 1
python_class: virtual_factory.equipment.valve.Valve
description: Control valve with Cv-based flow restriction and opening dynamics.
parameters:
  cv:
    type: number
    default: 50.0
  fail_position:
    type: string
    default: closed
ports:
  inlet:
    kind: physical
    direction: in
    medium: liquid
  outlet:
    kind: physical
    direction: out
    medium: liquid
  opening_command:
    kind: command
    direction: in
supported_variables:
  - opening_actual
  - outlet.flow_true
ui:
  icon: valve
  group: equipment
  layout_hint: process_node
