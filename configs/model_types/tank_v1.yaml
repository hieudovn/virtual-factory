id: tank_v1
display_name: Tank
category: equipment
version: 1
python_class: virtual_factory.equipment.tank.Tank
description: Tank with volume-to-level conversion, fill/depletion dynamics, and capacity limits.
parameters:
  capacity_m3:
    type: number
    default: 10.0
  initial_level_m:
    type: number
    default: 1.0
ports:
  inlet:
    kind: physical
    direction: in
    medium: liquid
  outlet:
    kind: physical
    direction: out
    medium: liquid
supported_variables:
  - level_true
  - volume_true
  - pressure_true
ui:
  icon: tank
  group: equipment
  layout_hint: process_node
