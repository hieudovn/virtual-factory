# TIPA ASSY Demo Configuration — M6-S02
#
# Authoritative configuration for the TIPA Assembly Line Simulation Demo.
# Based on CLOSED M6-S01 baseline v0.9.
#
# All values are configuration-driven per M6-S01 requirement.
# No hard-coded values in runtime code.

plant:
  id: tipa_assy_demo
  name: "TIPA ASSY Demo"
  type: discrete_assembly

# --- Conveyor ---
conveyor:
  nominal_line_dwell_time_s: 120.0
  index_movement_duration_s: 0.0   # demo: instantaneous index
  positions:
    - PRE-ASSY
    - AP01
    - AP02
    - AP03
    - AP04
    - AP05
    - AP06
    - AP07
    - AP08
    - AP09
    - AP10
    - AP11

# --- Upstream ---
upstream:
  sso2_wip_prefix: SSO2
  rso2_wip_prefix: RSO2
  sso2_production_interval_s: 120.0
  rso2_production_interval_s: 120.0
  sso2_operation_type: shrink_fit      # PTC-01: configurable
  rso2_operation_type: rotor_assembly  # PTC-03

# --- Station Operation Durations (seconds) ---
# Separate from line dwell (INV-CONV-05).
station_durations:
  PRE-ASSY: 30.0
  AP01: 60.0
  AP02: 75.0
  AP03: 45.0
  AP04: 60.0
  AP05: 90.0
  AP06: 60.0
  AP07: 30.0
  AP08: 30.0
  AP09: 45.0
  AP10: 45.0
  AP11: 30.0

# --- AP04 Join ---
ap04:
  required_parent_sources:
    - SSO2
    - RSO2
  component_list: []   # PTC-05: empty placeholder; TBD by TIPA

# --- Identity ---
identity:
  motor_wip_prefix: MTR

# --- Simulation ---
simulation:
  time_multiplier: 1.0
  timing_behavior: DETERMINISTIC
  random_seed: 42

# --- Quality (M6-S03) ---
# All numeric limits are DEMO_SYNTHETIC — not TIPA-confirmed.
quality:
  AP03:
    max_attempts: 1
    scenario: PASS   # checklist always PASS for demo
  AP06:
    max_attempts: 2
    scenario: FAIL_FIRST_THEN_PASS   # demo exception path
    # Override per motor sequence: motor N → [attempt1, attempt2, ...]
    overrides:
      1: [PASS]                       # motor 1: PASS first attempt
      2: [FAIL, PASS]                 # motor 2: FAIL then PASS
  AP08:
    max_attempts: 2
    scenario: PASS
    overrides:
      2: [NG, PASS]                   # motor 2: NG then PASS
  AP11:
    max_attempts: 1
    scenario: PASS   # final QC always PASS for demo

# --- AUTO Timing Profiles (AUTO-TIME-01A) ---
# DEMO_SYNTHETIC — NOT TIPA-CONFIRMED. Illustrative sub-action timing for AUTO
# mode. Nominal profile sums align with station_durations above so future
# AUTO fallback equivalence is clean. Runtime wiring is NOT enabled in 01A.
auto_timing_profiles:
  AP03:
    profile_id: AP03_AUTO_V1
    sub_actions:
      - id: mechanical_check
        duration: { type: fixed, seconds: 25 }
      - id: checklist_execution
        duration: { type: normal, mean_s: 15, stddev_s: 3, min_s: 10, max_s: 25 }
      - id: confirmation
        duration: { type: fixed, seconds: 5 }

  AP04:
    profile_id: AP04_AUTO_V1
    sub_actions:
      - id: positioning
        duration: { type: fixed, seconds: 10 }
      - id: alignment
        duration: { type: normal, mean_s: 12, stddev_s: 2, min_s: 8, max_s: 18 }
      - id: join
        duration: { type: fixed, seconds: 28 }
      - id: verification
        duration: { type: fixed, seconds: 10 }

  AP05:
    profile_id: AP05_AUTO_V1
    sub_actions:
      - id: mechanical_assembly
        duration: { type: normal, mean_s: 60, stddev_s: 6, min_s: 48, max_s: 78 }
      - id: verification
        duration: { type: fixed, seconds: 30 }

  AP06:
    profile_id: AP06_AUTO_V1
    sub_actions:
      - id: fixture
        duration: { type: fixed, seconds: 10 }
      - id: test
        duration: { type: normal, mean_s: 40, stddev_s: 5, min_s: 30, max_s: 55 }
      - id: evaluation
        duration: { type: fixed, seconds: 10 }

  AP08:
    profile_id: AP08_AUTO_V1
    sub_actions:
      - id: vision_acquisition
        duration: { type: fixed, seconds: 8 }
      - id: analysis
        duration: { type: normal, mean_s: 16, stddev_s: 2, min_s: 10, max_s: 22 }
      - id: decision
        duration: { type: fixed, seconds: 6 }

  AP11:
    profile_id: AP11_AUTO_V1
    sub_actions:
      - id: final_qc
        duration: { type: normal, mean_s: 30, stddev_s: 4, min_s: 20, max_s: 40 }

# ═══════════════════════════════════════════════════════════
# M6-S04B-I01 — Production Line Deployment Identity (ADDITIVE)
# ═══════════════════════════════════════════════════════════
#
# This section is ADDITIVE. The existing process/runtime config
# (conveyor, station_durations, upstream, quality, ap04, identity,
# simulation) is unchanged and continues to be loaded by
# load_assy_config_from_yaml() as before.
#
# This section is read by load_assy_demo_identity_from_yaml().
#
# TIPA Production Hierarchy:
#   TIPA Plant
#   └── ASSY Production Line
#       ├── ASSY-SL01 ─┐
#       ├── ASSY-SL02  ├─ Hydraulic SSO2 Input Variant
#       ├── ASSY-SL03 ─┘
#       ├── ASSY-SL04 ─┐
#       ├── ASSY-SL05  ├─ Thermal SSO2 Input Variant
#       └── ASSY-SL06 ─┘

production_line:
  plant_id: TIPA
  id: ASSY
  label: "ASSY Line"

  sub_lines:
    - id: ASSY-SL01
      variant: hydraulic
      label: "ASSY-SL01 — Hydraulic"

    - id: ASSY-SL02
      variant: hydraulic
      label: "ASSY-SL02 — Hydraulic"

    - id: ASSY-SL03
      variant: hydraulic
      label: "ASSY-SL03 — Hydraulic"

    - id: ASSY-SL04
      variant: thermal
      label: "ASSY-SL04 — Thermal"

    - id: ASSY-SL05
      variant: thermal
      label: "ASSY-SL05 — Thermal"

    - id: ASSY-SL06
      variant: thermal
      label: "ASSY-SL06 — Thermal"

  demo:
    target_sub_line_for_exception: ASSY-SL03
