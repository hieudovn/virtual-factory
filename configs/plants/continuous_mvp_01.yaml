plant:
  id: continuous_mvp_01
  name: Continuous Water Transfer and Tank Level Control
  type: continuous_process
  description: >
    MVP plant configuration for source tank, pump, control valve, destination tank,
    measured instrumentation, PID control, and valve actuation.

medium:
  id: water
  display_name: Water
  density_kg_m3: 997.0
  viscosity_pa_s: 0.00089
  specific_heat_j_kg_k: 4182.0

equipment:
  - id: T101
    model_type: tank_v1
    display_name: Source Tank
    parameters:
      capacity_m3: 10.0
      initial_level_m: 4.0
      max_level_m: 5.0
  - id: P101
    model_type: centrifugal_pump_v1
    display_name: Centrifugal Pump
    parameters:
      rated_flow_m3_s: 0.012
      rated_head_m: 18.0
  - id: V101
    model_type: control_valve_v1
    display_name: Control Valve
    parameters:
      cv: 50.0
      fail_position: closed
      initial_opening_percent: 0.0
  - id: T102
    model_type: tank_v1
    display_name: Destination Tank
    parameters:
      capacity_m3: 8.0
      initial_level_m: 1.0
      max_level_m: 5.0
      outlet_demand_m3_s: 0.006

connections:
  - id: C001
    type: physical
    from: T101.outlet
    to: P101.inlet
    medium: water
  - id: C002
    type: physical
    from: P101.outlet
    to: V101.inlet
    medium: water
  - id: C003
    type: physical
    from: V101.outlet
    to: T102.inlet
    medium: water

sensors:
  - id: LT102
    model_type: level_transmitter_v1
    display_name: T102 Level Transmitter
    measures: T102.level_true
    output_signal: LT102_LEVEL
    parameters:
      sample_time_s: 1.0
      resolution: 0.01
      noise_std: 0.0
      delay_s: 0.0
      quality: GOOD
  - id: FT101
    model_type: flow_transmitter_v1
    display_name: V101 Outlet Flow Transmitter
    measures: V101.outlet.flow_true
    output_signal: FT101_FLOW
    parameters:
      sample_time_s: 1.0
      resolution: 0.0001
      noise_std: 0.0
      delay_s: 0.0
      quality: GOOD
  - id: PT101
    model_type: pressure_transmitter_v1
    display_name: P101 Discharge Pressure Transmitter
    measures: P101.discharge_pressure_true
    output_signal: PT101_PRESSURE
    parameters:
      sample_time_s: 1.0
      resolution: 0.01
      noise_std: 0.0
      delay_s: 0.0
      quality: GOOD

controllers:
  - id: LIC102
    model_type: pid_controller_v1
    display_name: T102 Level Controller
    pv_signal: LT102_LEVEL
    setpoint: 2.5
    output_signal: LIC102_OUT
    scan_time_s: 0.5
    parameters:
      kp: 1.0
      ki: 0.1
      kd: 0.0

actuators:
  - id: VA101
    model_type: valve_actuator_v1
    display_name: V101 Valve Actuator
    command_signal: LIC102_OUT
    feedback_signal: V101_OPENING_FEEDBACK
    actuates: V101.opening_actual
    parameters:
      max_rate: 20.0

signals:
  LT102_LEVEL:
    category: industrial_signal
    publish: true
    unit: m
    source: LT102
  FT101_FLOW:
    category: industrial_signal
    publish: true
    unit: m3/s
    source: FT101
  PT101_PRESSURE:
    category: industrial_signal
    publish: true
    unit: kPa
    source: PT101
  LIC102_OUT:
    category: controller_signal
    publish: true
    unit: percent
    source: LIC102
  V101_OPENING_FEEDBACK:
    category: actuator_feedback
    publish: true
    unit: percent
    source: VA101
  T102_LEVEL_TRUE:
    category: internal_truth
    publish: false
    unit: m
    source: T102.level_true
  T102_LOW_LEVEL_ALARM:
    category: industrial_event
    publish: true
    unit: bool
    source: alarm.T102_LOW_LEVEL
  T102_HIGH_LEVEL_ALARM:
    category: industrial_event
    publish: true
    unit: bool
    source: alarm.T102_HIGH_LEVEL
  P101_NO_FLOW_ALARM:
    category: industrial_event
    publish: true
    unit: bool
    source: alarm.P101_NO_FLOW
  V101_POSITION_DEVIATION_ALARM:
    category: industrial_event
    publish: true
    unit: bool
    source: alarm.V101_POSITION_DEVIATION
  LT102_BAD_QUALITY_ALARM:
    category: industrial_event
    publish: true
    unit: bool
    source: alarm.LT102_BAD_QUALITY

alarms:
  - id: T102_LOW_LEVEL
    source_signal: LT102_LEVEL
    type: low
    threshold: 0.5
    severity: warning
    message: T102 level is low
    output_signal: T102_LOW_LEVEL_ALARM
  - id: T102_HIGH_LEVEL
    source_signal: LT102_LEVEL
    type: high
    threshold: 4.5
    severity: warning
    message: T102 level is high
    output_signal: T102_HIGH_LEVEL_ALARM
  - id: P101_NO_FLOW
    source_signal: FT101_FLOW
    type: low
    threshold: 0.0001
    severity: alarm
    message: P101 no flow condition
    output_signal: P101_NO_FLOW_ALARM
  - id: V101_POSITION_DEVIATION
    source_signal: V101_OPENING_FEEDBACK
    type: low
    threshold: 1.0
    severity: warning
    message: V101 opening feedback is near closed
    output_signal: V101_POSITION_DEVIATION_ALARM
  - id: LT102_BAD_QUALITY
    source_signal: LT102_LEVEL
    type: bad_quality
    threshold: GOOD
    severity: warning
    message: LT102 signal quality is not GOOD
    output_signal: LT102_BAD_QUALITY_ALARM

output_policy:
  mode: industrial
  publish_categories:
    - industrial_signal
    - controller_signal
    - actuator_feedback
    - industrial_event
  forbidden_categories:
    - internal_truth
  rule: internal_truth must not be published
