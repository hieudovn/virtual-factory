<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TIPA ASSY Demo — M6-S04</title>
<link rel="stylesheet" href="/static/assy_demo.css">
</head>
<body>
<div id="app">
  <!-- Header -->
  <header>
    <h1>TIPA Motor Assembly Line Simulation</h1>
    <div id="status-bar">
      <span id="sim-time">t=0s</span>
      <span id="line-state" class="state stopped">STOPPED</span>
      <span id="dwell">Dwell 0</span>
      <span id="speed-display">1x</span>
      <span id="scenario-display">HAPPY_PATH</span>
    </div>
  </header>

  <!-- Main Content -->
  <main>
    <!-- ASSY Line -->
    <section id="assy-line">
      <div id="conveyor-track">
        <div id="positions-container"></div>
      </div>
      <div id="line-legend">
        <span class="legend pass">PASS</span>
        <span class="legend fail">FAIL/NG</span>
        <span class="legend hold">HOLD</span>
        <span class="legend released">RELEASED</span>
        <span class="legend empty">EMPTY</span>
      </div>
    </section>

    <!-- Side Panel -->
    <aside id="side-panel">
      <!-- Production Summary -->
      <div class="panel-box">
        <h3>Production</h3>
        <div id="prod-summary">
          <div>Motors: <span id="motors-completed">0</span></div>
          <div>Released: <span id="motors-released">0</span></div>
          <div>On line: <span id="wips-on-line">0</span></div>
          <div>Holds: <span id="active-holds">0</span></div>
          <div>RSO2 buffer: <span id="rso2-buf">0</span></div>
        </div>
      </div>

      <!-- Genealogy -->
      <div class="panel-box" id="genealogy-panel">
        <h3>Genealogy (last joins)</h3>
        <div id="genealogy-list"></div>
      </div>

      <!-- Quality Events -->
      <div class="panel-box">
        <h3>Recent Quality Events</h3>
        <div id="quality-events"></div>
      </div>
    </aside>
  </main>

  <!-- Controls -->
  <footer id="controls">
    <button id="btn-reset" onclick="ctrl.reset()">⟳ RESET</button>
    <button id="btn-step" onclick="ctrl.step()">▶ STEP</button>
    <button id="btn-auto" onclick="ctrl.toggleAuto()">▶▶ AUTO</button>
    <button id="btn-pause" onclick="ctrl.pause()" disabled>⏸ PAUSE</button>
    <label>Speed:
      <select id="speed-select" onchange="ctrl.setSpeed(this.value)">
        <option value="0.5">0.5x</option>
        <option value="1" selected>1x</option>
        <option value="2">2x</option>
        <option value="5">5x</option>
        <option value="10">10x</option>
      </select>
    </label>
    <label>Scenario:
      <select id="scenario-select" onchange="ctrl.setScenario(this.value)">
        <option value="HAPPY_PATH">Happy Path</option>
        <option value="AP06_FAIL_RETEST_PASS">AP06 Fail → Retest → Pass</option>
        <option value="AP08_NG_REINSPECT_PASS">AP08 NG → Reinspect → Pass</option>
        <option value="FAILED_FINAL">Failed Final</option>
      </select>
    </label>
  </footer>
</div>

<script src="/static/assy_demo.js"></script>
</body>
</html>
