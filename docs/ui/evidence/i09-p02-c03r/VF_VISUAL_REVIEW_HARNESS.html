<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VF Visual Review Harness — I09-P02-C03R-C01</title>
<link rel="stylesheet" href="/static/assy_demo.css">
<style>
  body { overflow-y: auto; background: var(--vf-bg-page); }
  .h-section { padding: 24px; border-bottom: 1px solid var(--vf-border); }
  .h-section h2 { font-size: 16px; margin-bottom: 16px; color: var(--vf-text); }
  .h-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; }
  .h-item { background: var(--vf-bg-surface); border: 1px solid var(--vf-border); border-radius: var(--vf-radius-md); padding: 16px; }
  .h-item h3 { font-size: 12px; color: var(--vf-text-muted); margin-bottom: 8px; text-transform: uppercase; }
  .h-svg { width: 100%; height: 160px; background: var(--vf-bg-canvas); border-radius: var(--vf-radius-sm); }
  .h-error { color: var(--vf-state-fail); font-size: 14px; padding: 40px; text-align: center; }
</style>
</head>
<body>
<div id="harness-root"><div class="h-error">Loading VF primitives from production module...</div></div>
<script src="/static/assy_demo.js"></script>
<script>
function build() {
  if (typeof VF === 'undefined') {
    document.getElementById('harness-root').innerHTML = '<div class="h-error">ERROR: VF not loaded. Run via python src/virtual_factory/main.py serve --port 8091</div>';
    return;
  }
  var STATION_X=[1780,1680,1580,1480,1380,1280,1180,1080,980,880,780,680];
  var STATIONS=['PRE-ASSY','AP01','AP02','AP03','AP04','AP05','AP06','AP07','AP08','AP09','AP10','AP11'];
  var ARCH={PRE_ASSY:'INPUT',AP03:'CHECK',AP04:'JOIN',AP06:'TEST',AP08:'VISION',AP09:'PACK',AP10:'PACK',AP11:'FINAL'};
  var LM={AP04:'JOIN',AP06:'TEST',AP08:'VISION',AP11:'FINAL'};
  var h='';
  // 1. Full Line
  var sh='';
  STATIONS.forEach(function(s,i){sh+=VF.station(STATION_X[i],240,s,ARCH[s]||'MANUAL',!!LM[s],false,false);});
  sh+=VF.wipToken(1580,240,'SSO2-X','STATOR',false,'',null);
  sh+=VF.wipToken(1280,240,'MTR-X1','JOINED',false,'',null);
  sh+=VF.wipToken(1180,240,'MTR-X2','PRETEST',false,'',null);
  sh+=VF.wipToken(980,240,'MTR-X3','TESTED',false,'',null);
  sh+=VF.wipToken(780,240,'MTR-X4','PACKED',false,'',null);
  sh+=VF.wipToken(1080,240,'MTR-H1','TESTED',true,'HOLD',null);
  h+='<div class="h-section"><h2>1. Full Line — 12 Stations (RIGHT to LEFT flow)</h2><svg viewBox="0 0 1920 520" style="width:100%;height:400px;background:var(--vf-bg-canvas);">';
  for(var gx=0;gx<=1920;gx+=40)h+='<line x1="'+gx+'" y1="0" x2="'+gx+'" y2="520" stroke="var(--vf-grid-minor)" stroke-width="0.5"/>';
  for(var gy=0;gy<=520;gy+=40)h+='<line x1="0" y1="'+gy+'" x2="1920" y2="'+gy+'" stroke="var(--vf-grid-minor)" stroke-width="0.5"/>';
  h+='<rect x="1720" y="50" width="180" height="320" rx="5" fill="#FBFCFD" stroke="var(--vf-border)" stroke-width="1.2" stroke-dasharray="6,4"/><text x="1810" y="70" fill="var(--vf-text-muted)" font-size="11" text-anchor="middle" font-weight="600">RAW MATERIAL</text>';
  h+='<rect x="40" y="50" width="180" height="320" rx="5" fill="#FBFCFD" stroke="var(--vf-border)" stroke-width="1.2" stroke-dasharray="6,4"/><text x="130" y="70" fill="var(--vf-text-muted)" font-size="11" text-anchor="middle" font-weight="600">FINISHED GOODS</text>';
  h+='<rect x="100" y="370" width="1720" height="44" rx="5" fill="var(--vf-conveyor-body)"/><rect x="100" y="364" width="1720" height="8" rx="3" fill="var(--vf-conveyor-frame)"/><rect x="100" y="412" width="1720" height="8" rx="3" fill="var(--vf-conveyor-frame)"/>';
  for(var ax=280;ax<1700;ax+=280)h+='<line x1="'+(ax+20)+'" y1="392" x2="'+(ax-20)+'" y2="392" stroke="var(--vf-flow-product)" stroke-width="3" marker-end="url(#ha)"/>';
  h+='<line x1="1880" y1="392" x2="1800" y2="392" stroke="var(--vf-flow-material)" stroke-width="3" marker-end="url(#ha)"/><text x="1890" y="382" fill="var(--vf-flow-material)" font-size="10" font-weight="600" text-anchor="end">SSO2</text>';
  h+='<line x1="180" y1="392" x2="100" y2="392" stroke="var(--vf-flow-product)" stroke-width="3.5" marker-end="url(#ha)"/><text x="175" y="382" fill="var(--vf-flow-product)" font-size="10" font-weight="600" text-anchor="end">OUT</text>';
  h+='<line x1="1380" y1="230" x2="1380" y2="364" stroke="#C8960E" stroke-width="2.5" stroke-dasharray="6,3" marker-end="url(#ha)"/><text x="1390" y="240" fill="#C8960E" font-size="9" font-weight="600">RSO2</text>';
  h+=sh;
  h+='<g transform="translate(1810,340)">'+VF.pallet(0,0)+VF.statorAssy(0,-2)+'</g><g transform="translate(1810,280)">'+VF.pallet(0,0)+VF.rotor(0,-2)+'</g><g transform="translate(130,340)">'+VF.pallet(0,0)+VF.packedGoods(0,-2)+'</g>';
  h+='<defs><marker id="ha" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="var(--vf-flow-product)"/></marker></defs></svg></div>';

  // 2. Object Catalog — 6 WIP Categories
  h+='<div class="h-section"><h2>2. Object Catalog — 6 WIP Visual Categories</h2><div class="h-grid">';
  [{l:'STATOR ASSY',f:'statorAssy'},{l:'ROTOR',f:'rotor'},{l:'MTR JOINED',f:'motorJoined'},{l:'MTR PRE-TEST',f:'motorPreTest'},{l:'TESTED MTR (blue T)',f:'motorTested'},{l:'PACKED GOODS',f:'packedGoods'}].forEach(function(o){
    h+='<div class="h-item"><h3>'+o.l+'</h3><svg class="h-svg" viewBox="0 0 200 120" style="height:120px;"><rect width="200" height="120" fill="var(--vf-bg-canvas)"/>'+VF.pallet(100,100)+VF[o.f](100,78)+'</svg></div>';
  });
  h+='</div></div>';

  // 3. Station Catalog — 8 Archetypes (using production VF.stationBody)
  h+='<div class="h-section"><h2>3. Station Catalog — 8 Archetypes</h2><div class="h-grid">';
  [{a:'INPUT',s:'PRE-ASSY',l:'Input / Prep'},{a:'MANUAL',s:'AP01',l:'Manual Assy'},{a:'CHECK',s:'AP03',l:'Mech Check'},{a:'JOIN',s:'AP04',l:'JOIN'},{a:'TEST',s:'AP06',l:'EOL Test'},{a:'VISION',s:'AP08',l:'Vision'},{a:'PACK',s:'AP09',l:'Boxing/Pack'},{a:'FINAL',s:'AP11',l:'Final QC'}].forEach(function(x){
    h+='<div class="h-item"><h3>'+x.l+' ('+x.a+')</h3><svg class="h-svg" viewBox="0 0 200 120" style="height:120px;"><rect width="200" height="120" fill="var(--vf-bg-canvas)"/>'+VF.stationBody(100,50,x.a,x.s)+'</svg></div>';
  });
  h+='</div></div>';

  // 4. AP04 JOIN
  h+='<div class="h-section"><h2>4. AP04 JOIN — Two-Input</h2><svg viewBox="0 0 500 320" style="width:100%;height:300px;background:var(--vf-bg-canvas);">';
  h+='<rect x="80" y="210" width="340" height="44" rx="5" fill="var(--vf-conveyor-body)"/><rect x="80" y="204" width="340" height="8" rx="3" fill="var(--vf-conveyor-frame)"/>';
  h+='<g transform="translate(300,210)">'+VF.pallet(0,0)+VF.statorAssy(0,-8)+'</g><text x="300" y="190" fill="var(--vf-obj-stator)" font-size="9" text-anchor="middle" font-weight="600">STATOR</text>';
  h+='<g transform="translate(250,140)">'+VF.pallet(0,0)+VF.rotor(0,-8)+'</g><text x="250" y="125" fill="var(--vf-obj-rotor)" font-size="9" text-anchor="middle" font-weight="600">ROTOR</text>';
  h+='<line x1="250" y1="175" x2="250" y2="204" stroke="#C8960E" stroke-width="2.5" stroke-dasharray="6,3" marker-end="url(#ha2)"/>';
  h+=VF.station(250,210,'AP04','JOIN',true,false,false);
  h+='<g transform="translate(180,210)">'+VF.pallet(0,0)+VF.motorJoined(0,-8)+'</g><text x="180" y="190" fill="var(--vf-obj-joined)" font-size="9" text-anchor="middle" font-weight="600">JOINED</text>';
  h+='<line x1="420" y1="240" x2="380" y2="240" stroke="var(--vf-flow-product)" stroke-width="3" marker-end="url(#ha2)"/><line x1="230" y1="240" x2="200" y2="240" stroke="var(--vf-flow-product)" stroke-width="3" marker-end="url(#ha2)"/>';
  h+='<defs><marker id="ha2" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="var(--vf-flow-product)"/></marker></defs></svg></div>';

  // 5. AP06 Fail/Retest
  h+='<div class="h-section"><h2>5. AP06 Fail / Retest</h2><svg viewBox="0 0 500 280" style="width:100%;height:260px;background:var(--vf-bg-canvas);">';
  h+='<rect x="80" y="190" width="340" height="44" rx="5" fill="var(--vf-conveyor-body)"/>';
  h+=VF.station(250,190,'AP06','TEST',true,false,true);
  h+='<g transform="translate(250,240)">'+VF.pallet(0,0)+VF.motorPreTest(0,-8)+'</g>'+VF.stateOverlay(250,248,'HOLD');
  h+='<text x="250" y="215" fill="var(--vf-state-fail)" font-size="10" text-anchor="middle" font-weight="600">HOLD — retest pending</text>';
  h+='<line x1="420" y1="220" x2="380" y2="220" stroke="var(--vf-flow-product)" stroke-width="3" marker-end="url(#ha3)"/>';
  h+='<defs><marker id="ha3" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="var(--vf-flow-product)"/></marker></defs></svg></div>';

  // 6. AP08 NG/Reinspect
  h+='<div class="h-section"><h2>6. AP08 NG / Reinspect</h2><svg viewBox="0 0 500 280" style="width:100%;height:260px;background:var(--vf-bg-canvas);">';
  h+='<rect x="80" y="190" width="340" height="44" rx="5" fill="var(--vf-conveyor-body)"/>';
  h+=VF.station(250,190,'AP08','VISION',true,false,false);
  h+='<g transform="translate(250,240)">'+VF.pallet(0,0)+VF.motorTested(0,-8)+'</g>'+VF.stateOverlay(250,248,'NG');
  h+='<text x="250" y="215" fill="var(--vf-state-fail)" font-size="10" text-anchor="middle" font-weight="600">NG — reinspect pending</text>';
  h+='<line x1="420" y1="220" x2="380" y2="220" stroke="var(--vf-flow-product)" stroke-width="3" marker-end="url(#ha4)"/>';
  h+='<defs><marker id="ha4" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="var(--vf-flow-product)"/></marker></defs></svg></div>';

  // 7. Packaging Boundary AP09→AP10→AP11
  h+='<div class="h-section"><h2>7. AP09 Boxing to AP10 Pack/Label to AP11 Final QC</h2><svg viewBox="0 0 700 340" style="width:100%;height:300px;background:var(--vf-bg-canvas);">';
  h+='<rect x="60" y="210" width="580" height="44" rx="5" fill="var(--vf-conveyor-body)"/><rect x="60" y="204" width="580" height="8" rx="3" fill="var(--vf-conveyor-frame)"/>';
  h+=VF.station(580,210,'AP09','PACK',false,false,false);
  h+=VF.station(400,210,'AP10','PACK',false,false,false);
  h+=VF.station(220,210,'AP11','FINAL',true,false,false);
  h+='<g transform="translate(580,260)">'+VF.pallet(0,0)+VF.motorTested(0,-8)+'</g>';
  h+='<g transform="translate(400,260)">'+VF.pallet(0,0)+VF.packedGoods(0,-8)+'</g>';
  h+='<g transform="translate(220,260)">'+VF.pallet(0,0)+VF.packedGoods(0,-8)+'</g>';
  h+='<text x="580" y="240" fill="var(--vf-text-secondary)" font-size="9" text-anchor="middle">TESTED MTR</text>';
  h+='<text x="400" y="240" fill="var(--vf-obj-packed)" font-size="9" text-anchor="middle" font-weight="600">CARTON</text>';
  h+='<text x="220" y="240" fill="var(--vf-state-pass)" font-size="9" text-anchor="middle" font-weight="600">QC PASS</text>';
  h+='<line x1="560" y1="240" x2="530" y2="240" stroke="var(--vf-flow-product)" stroke-width="3" marker-end="url(#ha5)"/><line x1="380" y1="240" x2="350" y2="240" stroke="var(--vf-flow-product)" stroke-width="3" marker-end="url(#ha5)"/><line x1="200" y1="240" x2="170" y2="240" stroke="var(--vf-flow-product)" stroke-width="3" marker-end="url(#ha5)"/>';
  h+='<defs><marker id="ha5" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="var(--vf-flow-product)"/></marker></defs></svg></div>';

  // 8. 1366 View note
  h+='<div class="h-section"><h2>8. 1366 View</h2><p style="font-size:12px;color:var(--vf-text-secondary);">All primitives loaded from production VF.* module. Sidebar 140px at 1366. Text min 11px. Arrows point LEFT (RIGHT to LEFT flow).</p></div>';

  document.getElementById('harness-root').innerHTML = h;
}
setTimeout(build, 100);
</script>
</body>
</html>
