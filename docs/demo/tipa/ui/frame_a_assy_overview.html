<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>DG03 Frame A — ASSY Line Overview</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#0d1117; display:flex; justify-content:center; align-items:center; height:100vh; font-family:'Segoe UI',system-ui,sans-serif; }
  svg { max-width:100%; max-height:100%; }
</style></head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0d1117"/><stop offset="100%" stop-color="#161b22"/></linearGradient>
    <linearGradient id="headerGrad" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#1a2332"/><stop offset="100%" stop-color="#0f1a2e"/></linearGradient>
    <linearGradient id="hydroGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#1a2740"/><stop offset="100%" stop-color="#111d30"/></linearGradient>
    <linearGradient id="thermalGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#221a30"/><stop offset="100%" stop-color="#181125"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="2" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#bg)"/>

  <!-- Header Bar -->
  <rect x="0" y="0" width="1920" height="64" fill="url(#headerGrad)"/>
  <line x1="0" y1="64" x2="1920" y2="64" stroke="#1e3a5f" stroke-width="2"/>
  <text x="32" y="42" fill="#e0e0e0" font-size="22" font-weight="600">TIPA MOTOR PRODUCTION</text>
  <text x="280" y="42" fill="#4ecca3" font-size="13" opacity="0.8">ASSY LINE OVERVIEW</text>

  <!-- Status Bar (right side) -->
  <g transform="translate(1400,0)">
    <rect x="0" y="8" width="80" height="48" rx="4" fill="#0f1a2e" stroke="#1e3a5f" stroke-width="1"/>
    <text x="40" y="28" fill="#888" font-size="10" text-anchor="middle">SIM TIME</text>
    <text x="40" y="46" fill="#4ecca3" font-size="14" text-anchor="middle" font-family="monospace">00:12:34</text>
    <rect x="90" y="8" width="80" height="48" rx="4" fill="#0f1a2e" stroke="#1e3a5f" stroke-width="1"/>
    <text x="130" y="28" fill="#888" font-size="10" text-anchor="middle">SCENARIO</text>
    <text x="130" y="46" fill="#e0e0e0" font-size="13" text-anchor="middle">HAPPY_PATH</text>
    <rect x="180" y="8" width="60" height="48" rx="4" fill="#0f1a2e" stroke="#1e3a5f" stroke-width="1"/>
    <text x="210" y="28" fill="#888" font-size="10" text-anchor="middle">SPEED</text>
    <text x="210" y="46" fill="#ffc107" font-size="13" text-anchor="middle">1x</text>
  </g>

  <!-- Section: Hydraulic -->
  <text x="80" y="120" fill="#8899bb" font-size="15" font-weight="600">HYDRAULIC SSO2 INPUT VARIANT</text>
  <line x1="80" y1="128" x2="460" y2="128" stroke="#1e3a5f" stroke-width="1"/>

  <!-- Hydraulic Sub-lines -->
  <g transform="translate(80,150)">
    <!-- SL01 - Operating -->
    <g>
      <rect x="0" y="0" width="520" height="160" rx="6" fill="url(#hydroGrad)" stroke="#1e3a5f" stroke-width="1"/>
      <text x="16" y="24" fill="#8899bb" font-size="12" font-weight="600">ASSY-SL01</text>
      <rect x="120" y="10" width="80" height="22" rx="3" fill="#1b4332" stroke="#2d6a4f" stroke-width="1"/>
      <text x="160" y="26" fill="#4ecca3" font-size="11" text-anchor="middle">OPERATING</text>
      <!-- Simplified flow -->
      <rect x="16" y="44" width="468" height="8" rx="4" fill="#1e3a5f"/>
      <circle cx="48" cy="48" r="6" fill="#4ecca3" opacity="0.6"/>
      <circle cx="130" cy="48" r="6" fill="#4ecca3" opacity="0.4"/>
      <circle cx="212" cy="48" r="6" fill="#4ecca3" opacity="0.4"/>
      <circle cx="294" cy="48" r="6" fill="#ffc107" opacity="0.6"/>
      <circle cx="376" cy="48" r="6" fill="#4ecca3" opacity="0.4"/>
      <circle cx="458" cy="48" r="6" fill="#4ecca3" opacity="0.3"/>
      <!-- Stats -->
      <text x="16" y="82" fill="#666" font-size="10">WIP: 5</text>
      <text x="100" y="82" fill="#666" font-size="10">OUTPUT: 3</text>
      <text x="200" y="82" fill="#666" font-size="10">DWELL: 12</text>
      <text x="300" y="82" fill="#4ecca3" font-size="10">NORMAL</text>
      <!-- Feeder hint -->
      <rect x="16" y="100" width="40" height="14" rx="2" fill="#0f1a2e" stroke="#1e3a5f" stroke-width="0.5"/>
      <text x="36" y="111" fill="#555" font-size="8" text-anchor="middle">SSO2(H)</text>
      <!-- Output hint -->
      <rect x="436" y="100" width="48" height="14" rx="2" fill="#0f1a2e" stroke="#1e3a5f" stroke-width="0.5"/>
      <text x="460" y="111" fill="#555" font-size="8" text-anchor="middle">MOTOR</text>
    </g>

    <!-- SL02 - Operating -->
    <g transform="translate(0,175)">
      <rect x="0" y="0" width="520" height="160" rx="6" fill="url(#hydroGrad)" stroke="#1e3a5f" stroke-width="1"/>
      <text x="16" y="24" fill="#8899bb" font-size="12" font-weight="600">ASSY-SL02</text>
      <rect x="120" y="10" width="80" height="22" rx="3" fill="#1b4332" stroke="#2d6a4f" stroke-width="1"/>
      <text x="160" y="26" fill="#4ecca3" font-size="11" text-anchor="middle">OPERATING</text>
      <rect x="16" y="44" width="468" height="8" rx="4" fill="#1e3a5f"/>
      <circle cx="48" cy="48" r="6" fill="#4ecca3" opacity="0.6"/>
      <circle cx="130" cy="48" r="6" fill="#4ecca3" opacity="0.4"/>
      <circle cx="294" cy="48" r="6" fill="#ffc107" opacity="0.6"/>
      <circle cx="458" cy="48" r="6" fill="#4ecca3" opacity="0.3"/>
      <text x="16" y="82" fill="#666" font-size="10">WIP: 4</text>
      <text x="100" y="82" fill="#666" font-size="10">OUTPUT: 4</text>
      <text x="200" y="82" fill="#666" font-size="10">DWELL: 15</text>
      <text x="300" y="82" fill="#4ecca3" font-size="10">NORMAL</text>
    </g>

    <!-- SL03 - QUALITY HOLD (selected/highlighted) -->
    <g transform="translate(0,350)">
      <rect x="0" y="0" width="520" height="160" rx="6" fill="url(#hydroGrad)" stroke="#e94560" stroke-width="2" filter="url(#glow)"/>
      <text x="16" y="24" fill="#ff6b81" font-size="12" font-weight="600">ASSY-SL03</text>
      <rect x="120" y="10" width="100" height="22" rx="3" fill="#4a1a1a" stroke="#e94560" stroke-width="1"/>
      <text x="170" y="26" fill="#e94560" font-size="11" text-anchor="middle">QUALITY HOLD</text>
      <rect x="16" y="44" width="468" height="8" rx="4" fill="#1e3a5f"/>
      <circle cx="48" cy="48" r="6" fill="#4ecca3" opacity="0.3"/>
      <circle cx="130" cy="48" r="6" fill="#4ecca3" opacity="0.3"/>
      <circle cx="212" cy="48" r="6" fill="#e94560" opacity="0.8" filter="url(#glow)"/>
      <circle cx="294" cy="48" r="6" fill="#333" opacity="0.3"/>
      <text x="16" y="82" fill="#666" font-size="10">WIP: 6</text>
      <text x="100" y="82" fill="#666" font-size="10">OUTPUT: 1</text>
      <text x="200" y="82" fill="#666" font-size="10">DWELL: 8</text>
      <text x="300" y="82" fill="#e94560" font-size="10">AP06 — MTR-0003 — FAIL #1</text>
    </g>
  </g>

  <!-- Section: Thermal -->
  <text x="680" y="120" fill="#9988bb" font-size="15" font-weight="600">THERMAL SSO2 INPUT VARIANT</text>
  <line x1="680" y1="128" x2="1060" y2="128" stroke="#2a1a40" stroke-width="1"/>

  <g transform="translate(680,150)">
    <!-- SL04 -->
    <g>
      <rect x="0" y="0" width="520" height="160" rx="6" fill="url(#thermalGrad)" stroke="#2a1a40" stroke-width="1"/>
      <text x="16" y="24" fill="#9988bb" font-size="12" font-weight="600">ASSY-SL04</text>
      <rect x="120" y="10" width="80" height="22" rx="3" fill="#1b4332" stroke="#2d6a4f" stroke-width="1"/>
      <text x="160" y="26" fill="#4ecca3" font-size="11" text-anchor="middle">OPERATING</text>
      <rect x="16" y="44" width="468" height="8" rx="4" fill="#2a1a40"/>
      <circle cx="48" cy="48" r="6" fill="#4ecca3" opacity="0.5"/>
      <circle cx="212" cy="48" r="6" fill="#4ecca3" opacity="0.4"/>
      <circle cx="376" cy="48" r="6" fill="#ffc107" opacity="0.5"/>
      <text x="16" y="82" fill="#666" font-size="10">WIP: 5</text>
      <text x="100" y="82" fill="#666" font-size="10">OUTPUT: 3</text>
      <text x="300" y="82" fill="#4ecca3" font-size="10">NORMAL</text>
      <rect x="16" y="100" width="40" height="14" rx="2" fill="#141028" stroke="#2a1a40" stroke-width="0.5"/>
      <text x="36" y="111" fill="#555" font-size="8" text-anchor="middle">SSO2(T)</text>
    </g>

    <!-- SL05 -->
    <g transform="translate(0,175)">
      <rect x="0" y="0" width="520" height="160" rx="6" fill="url(#thermalGrad)" stroke="#2a1a40" stroke-width="1"/>
      <text x="16" y="24" fill="#9988bb" font-size="12" font-weight="600">ASSY-SL05</text>
      <rect x="120" y="10" width="80" height="22" rx="3" fill="#1b4332" stroke="#2d6a4f" stroke-width="1"/>
      <text x="160" y="26" fill="#4ecca3" font-size="11" text-anchor="middle">OPERATING</text>
      <text x="16" y="82" fill="#666" font-size="10">WIP: 4</text>
      <text x="100" y="82" fill="#666" font-size="10">OUTPUT: 4</text>
      <text x="300" y="82" fill="#4ecca3" font-size="10">NORMAL</text>
    </g>

    <!-- SL06 -->
    <g transform="translate(0,350)">
      <rect x="0" y="0" width="520" height="160" rx="6" fill="url(#thermalGrad)" stroke="#2a1a40" stroke-width="1"/>
      <text x="16" y="24" fill="#9988bb" font-size="12" font-weight="600">ASSY-SL06</text>
      <rect x="120" y="10" width="60" height="22" rx="3" fill="#0f1a2e" stroke="#2a1a40" stroke-width="1"/>
      <text x="150" y="26" fill="#17a2b8" font-size="11" text-anchor="middle">READY</text>
      <text x="16" y="82" fill="#666" font-size="10">WIP: 2</text>
      <text x="100" y="82" fill="#666" font-size="10">OUTPUT: 6</text>
      <text x="300" y="82" fill="#17a2b8" font-size="10">READY</text>
    </g>
  </g>

  <!-- Production Summary (bottom) -->
  <g transform="translate(32,960)">
    <rect x="0" y="0" width="1856" height="56" rx="4" fill="#0f1a2e" stroke="#1e3a5f" stroke-width="1"/>
    <text x="20" y="24" fill="#888" font-size="11">MOTORS CREATED: 18</text>
    <text x="200" y="24" fill="#888" font-size="11">RELEASED: 12</text>
    <text x="380" y="24" fill="#888" font-size="11">ACTIVE WIPs: 26</text>
    <text x="560" y="24" fill="#888" font-size="11">QUALITY HOLDS: 1</text>
    <text x="760" y="24" fill="#888" font-size="11">SSO2 BUFFER: 4</text>
    <text x="940" y="24" fill="#888" font-size="11">RSO2 BUFFER: 3</text>
    <text x="1600" y="24" fill="#555" font-size="10">ASSY LINE</text>
    <text x="1720" y="38" fill="#555" font-size="9">6 SUB-LINES</text>
  </g>

  <!-- Controls -->
  <g transform="translate(680,960)">
    <rect x="0" y="60" width="560" height="36" rx="4" fill="#0f1a2e" stroke="#1e3a5f" stroke-width="1"/>
    <rect x="10" y="66" width="70" height="24" rx="3" fill="#e94560"/>
    <text x="45" y="83" fill="#fff" font-size="11" text-anchor="middle" font-weight="600">RESET</text>
    <rect x="90" y="66" width="70" height="24" rx="3" fill="#4ecca3"/>
    <text x="125" y="83" fill="#0d1117" font-size="11" text-anchor="middle" font-weight="600">STEP</text>
    <rect x="170" y="66" width="70" height="24" rx="3" fill="#17a2b8"/>
    <text x="205" y="83" fill="#fff" font-size="11" text-anchor="middle" font-weight="600">AUTO</text>
    <rect x="250" y="66" width="70" height="24" rx="3" fill="#ffc107"/>
    <text x="285" y="83" fill="#0d1117" font-size="11" text-anchor="middle" font-weight="600">PAUSE</text>
    <text x="370" y="83" fill="#888" font-size="11">SPEED: 1x</text>
    <text x="450" y="83" fill="#888" font-size="11">SCENARIO: HAPPY_PATH</text>
  </g>
</svg>
</body>
</html>
