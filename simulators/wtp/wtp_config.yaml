# WTP Simulator Configuration
simulator:
  name: "wtp-sim-01"
  source: "wtp-sim-01"
  interval_s: 1.0
  max_frames_buffer: 3600
  auto_start: true

plantos:
  base_url: "http://localhost:8000"
  ingest_endpoint: "/api/v1/measurements/ingest"
  api_key: "plantos-edge-key-2026"
  retry:
    max_retries: 5
    base_delay_s: 1.0
    max_delay_s: 30.0
    backoff_multiplier: 2.0

scenario:
  default: "normal_operation"
  transition_s: 30.0

api:
  host: "0.0.0.0"
  port: 8100

opcua:
  enabled: true
  endpoint: "opc.tcp://0.0.0.0:4841"
  namespace: "WTP-Simulator"

logging:
  level: "INFO"
